name: Public source review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check public additions
        env:
          REVIEW_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
        run: python tools/validate_public_additions.py --base "$REVIEW_BASE"
      - name: Test metadata preflight controls
        run: python tools/test_alpha_preparation.py

# No contents:write, release job, package upload, or game-asset generation.
# Enable build/release jobs only after the source and resource gates are reviewed.
